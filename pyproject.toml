[project]
name = "keel"
version = "0.1.0"
description = "Causal retention decision engine for small subscription businesses"
readme = "README.md"
requires-python = ">=3.11"

# Phase 0 (SubSim + kill test) needs only these. Heavy ML deps are extras so the
# motivating experiment runs immediately without a long install.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    # Required by the Phase 0 kill test: the churn baseline must be a real model,
    # not a strawman (see docs/DECISIONS.md D-012).
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Phase 3 — survival models. Only the *baselines* need these: the discrete-time
# hazard, the CLV layer and every survival metric run on the base install, so the
# Phase 3 tests stay in CI. A metric that cannot be computed in CI is a metric that
# silently stops being checked.
survival = [
    "lifelines>=0.28",       # Cox baseline
    "scikit-survival>=0.22", # RSF baseline, GBSG2, and the metric cross-checks
    "lightgbm>=4.3",
]
# DeepSurv is the one baseline the Phase 3 gate names that needs a deep-learning
# stack. Split out because torch is ~2GB installed and nothing else here wants it;
# `DeepSurvBaseline.available()` reports False and the benchmark says so rather than
# failing.
deepsurv = ["torch>=2.2"]
# Phase 4 — causal / uplift baselines and the hierarchical model
causal = [
    "econml>=0.15",
    "causalml>=0.14",
    "pymc>=5.16",
    "arviz>=0.18",
]
# Phase 2 (e-commerce) — BTYD. Note: `lifetimes` is unmaintained; pymc-marketing
# is the successor and gives credible intervals, which the small-n thesis needs.
btyd = ["pymc-marketing>=0.9"]
viz = ["matplotlib>=3.8"]
# ruff is pinned to a minor range: its default rule set and autofix behaviour change
# between releases, and an unpinned linter makes CI non-reproducible. Bumping this is
# a deliberate act, not something that happens on a random Tuesday.
dev = ["pytest>=8.0", "ruff>=0.12,<0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned EXPLICITLY, and this is not cosmetic.
#
# Ruff's *default* rule set expands between releases. With only `line-length` and
# `target-version` configured and `ruff>=0.5` in the dev extra, CI floated to the
# newest release and linted a strictly larger rule set than a developer's pinned
# local install -- so `make check` passed locally and the identical command failed
# in CI with 21 errors (RUF046/059/100/022, UP035/037, I001).
#
# Selecting rules explicitly makes the rule set a property of the repository rather
# than of whichever ruff version happened to get installed. The version range below
# is belt-and-braces on top of that.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes -- real bugs
    "I",   # isort -- deterministic import order
    "UP",  # pyupgrade -- keep idioms current with target-version
    "B",   # flake8-bugbear -- genuine bug patterns
]
# `RUF` is deliberately excluded. Those are ruff's own opinions, they churn most
# between releases, and they are the main source of the drift described above.
# Excluding them buys determinism at the cost of some stylistic nits.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run from the repo root without an editable install. Without this,
# bare `pytest` fails while `python -m pytest` works -- a confusing discrepancy,
# since only the latter puts the CWD on sys.path.
pythonpath = ["."]
