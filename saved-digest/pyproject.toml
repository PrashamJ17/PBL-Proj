[project]
name = "saved-digest"
version = "0.1.0"
description = "Resurface, filter, fact-check and summarise the things you saved on YouTube and Instagram and never went back to"
readme = "README.md"
requires-python = ">=3.11"

# Deliberately small. The capture + enrich stages must run on a laptop with no
# build toolchain, so nothing here compiles.
dependencies = [
    "anthropic>=0.69",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
# Transcribing a Reel's *spoken* audio. Off by default: it pulls a ~100MB model
# and the default Instagram tier (caption + author) needs none of it. See
# docs/INSTAGRAM.md for why this is opt-in rather than standard.
audio = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.12,<0.13"]

[project.scripts]
saved-digest = "saveddigest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saveddigest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network-touching tests are opt-in: the default suite must pass offline.
markers = ["network: requires outbound network access (deselect with -m 'not network')"]
addopts = "-m 'not network'"
